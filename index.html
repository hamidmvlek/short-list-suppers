<title>Short List Suppers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&display=swap">
<style>
/* Layout: a typewritten menu card. Margin labels on the left, a bracket column, then items. One mono face, near-uniform size. */
:root{
  --bg:#f2f2f0;
  --ink:#1c1c1b;
  --mute:#7b7b77;
  --faint:#c9c9c5;
  --wash:#e8e8e5;
  --mono:"Geist Mono","DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --m:9ch;   /* margin label column */
  --b:3ch;   /* bracket column */
  --g:1.5ch; /* column gap */
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#131313;--ink:#e9e9e6;--mute:#8b8b87;--faint:#474745;--wash:#1e1e1d;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#131313;--ink:#e9e9e6;--mute:#8b8b87;--faint:#474745;--wash:#1e1e1d;color-scheme:dark}

html{font-size:clamp(15px, .55vw + 12.6px, 20px);-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--mono);font-weight:300;font-size:1rem;line-height:1.62;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
::selection{background:var(--ink);color:var(--bg)}

.page{
  max-width:44rem;margin:0 auto;
  padding-block:clamp(28px,6vw,64px) 120px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
h1,h2,h3,p,ol,ul{margin:0;padding:0;font-weight:inherit;font-size:inherit}
ol,ul{list-style:none}

.brand{font-weight:400;letter-spacing:.05em}
.meta{margin-top:1.7em;padding-left:4ch;display:grid;gap:.05em}
.meta li{display:flex;gap:1.2ch;letter-spacing:.04em;align-items:baseline}
.ic{flex:none;width:3ch;white-space:pre}
.ln{flex:1;min-width:0}
.meta .small{color:var(--mute)}
.meta .small .ln{font-size:.78rem;line-height:1.7}
.meta .small:first-of-type{margin-top:.2em}
#shopInfoRow{margin-top:.45em}
.strong{font-weight:400}
.u{text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:var(--faint);text-underline-offset:.28em;color:inherit;transition:text-decoration-color .2s}
@media (hover:hover){.u:hover{text-decoration-color:currentColor}}
.acts{display:flex;flex-wrap:wrap;gap:.2em 3ch}
.cur::after{content:"_";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* the live arrow */
.arrow-btn{flex:none;display:inline-flex;align-items:center;width:3ch;white-space:pre;letter-spacing:0;border-radius:1px;transition:background-color .25s,color .25s;touch-action:manipulation}
.rot{display:inline-flex;width:1ch;height:1em;justify-content:center;align-items:center;will-change:transform}
.nw{white-space:nowrap}
.rot svg{display:block;width:.95em;height:.95em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:square}
.arrow-btn.seek .rot svg{animation:seek 1.1s linear infinite}
@keyframes seek{to{transform:rotate(360deg)}}
.arrow-btn.aligned{background:var(--ink);color:var(--bg)}
.arrow-btn:active{transform:scale(.92)}
.filters{display:flex;flex-wrap:wrap;gap:.1em 2.5ch}
.fbtn{letter-spacing:.04em;color:var(--mute);transition:color .2s}
.fbtn[aria-checked="true"]{color:var(--ink)}
.fb{display:inline-flex;white-space:pre}
.fb i{display:inline-block;width:1ch;position:relative}
.fb i::after{content:"";position:absolute;left:50%;top:50%;width:.55em;height:.55em;margin:-.3em 0 0 -.275em;border-radius:50%;background:currentColor;transform:scale(0);transition:transform .3s cubic-bezier(.34,1.7,.5,1)}
.fbtn[aria-checked="true"] .fb i::after{transform:scale(1)}
.credit{margin-top:.6em;color:var(--mute);font-size:.72rem;letter-spacing:.05em}

section{margin-top:2.6em}

/* the shared grid row */
.row{
  display:grid;
  grid-template-columns:var(--m) var(--b) minmax(0,1fr) auto;
  column-gap:var(--g);
  align-items:baseline;
}
.lab{letter-spacing:.04em;white-space:nowrap;overflow:visible}
.qty{color:var(--mute);white-space:nowrap;text-align:right}
.mute{color:var(--mute)}

/* buttons as rows */
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left}
button:focus-visible{outline:1px solid var(--ink);outline-offset:3px;border-radius:1px}
.item{width:100%;padding-block:.06em;touch-action:manipulation}

/* bracket box: [ ] with a dot that pops in */
.box{position:relative;display:inline-flex;width:3ch;white-space:pre}
.box>span{width:1ch;text-align:center}
.dot{
  position:absolute;left:50%;top:53%;
  width:.52em;height:.52em;margin:-.26em 0 0 -.26em;border-radius:50%;
  background:var(--ink);transform:scale(0);
  transition:transform .32s cubic-bezier(.34,1.7,.5,1), opacity .2s;
}
.on .dot{transform:scale(1)}
@media (hover:hover){
  .item:not(.on):hover .dot{transform:scale(.38);opacity:.28}
}
.item:active .box{transform:scale(.9)}
.box{transition:transform .12s}

/* strike-through that draws across */
.txt{min-width:0}
.s{
  background:linear-gradient(currentColor,currentColor) no-repeat 0 58% / 0% 1px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  transition:background-size .38s cubic-bezier(.6,0,.2,1), color .3s;
}
#buyList .on .s{background-size:100% 1px;color:var(--mute)}
#buyList .on .qty{color:var(--faint)}

/* meal head */
.title-row h2{font-size:1.32em;font-weight:400;line-height:1.3;letter-spacing:-.01em;text-wrap:balance;min-height:1.3em}
.title-row .lab{font-size:1rem}
.sub{margin-top:.35em}
.sub p{grid-column:3 / -1;letter-spacing:.04em}
.actions{margin-top:1.1em}
.actions>div{grid-column:3 / -1;display:flex;flex-wrap:wrap;gap:.35em 3ch}
.act{letter-spacing:.05em;padding-block:.15em;white-space:nowrap}
.act .ic{display:inline-block}
.act .lbl{background:linear-gradient(currentColor,currentColor) no-repeat 0 100% / 0% 1px;transition:background-size .25s ease}
@media (hover:hover){.act:hover .lbl{background-size:100% 1px}}
.act:active{opacity:.6}
.spin .glyph{display:inline-block;animation:spin .55s cubic-bezier(.5,0,.2,1)}
@keyframes spin{to{transform:rotate(360deg)}}

/* progress */
.progress{margin-top:.9em}
.progress .mid{grid-column:2 / 4;display:flex;align-items:center;gap:1.5ch;flex-wrap:wrap;letter-spacing:.04em}
.bar{display:inline-flex;align-items:center;gap:.3ch;white-space:nowrap}
.seg{display:inline-block;width:.85ch;height:.62em;border:1px solid var(--ink);transition:background-color .25s}
.seg.f{background:var(--ink)}
#clearBtn{color:var(--mute);letter-spacing:.04em;transition:opacity .2s}
#clearBtn[aria-disabled="true"]{opacity:0;pointer-events:none}
.done-msg{transition:color .3s}
.all .done-msg{color:var(--ink)}

/* cook steps */
.step{padding-block:.18em}
.num{color:var(--mute);text-align:center}
.step .txt{text-wrap:pretty}

/* menu */
.menu-head{letter-spacing:.05em;font-weight:400;margin-bottom:1em}
#menuList .item .s{transition:color .2s}
#menuList .skip .s{color:var(--mute)}
#menuList .skip .mid{color:var(--mute)}
@media (hover:hover){#menuList .item:hover .s{background-size:100% 1px}}

.foot{margin-top:2.6em;padding-left:4ch}
.foot .act{letter-spacing:.05em}
.hint{margin-top:.6em;color:var(--mute);font-size:.8rem;letter-spacing:.05em;display:none}
@media (hover:hover) and (pointer:fine){.hint{display:block}}

/* entrance on meal change */
.enter>li{animation:rise .42s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 38ms)}
@keyframes rise{from{opacity:0;transform:translateY(5px)}}
.wave .dot{animation:pop .5s cubic-bezier(.34,1.7,.5,1) both;animation-delay:calc(var(--i) * 70ms)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}

/* toast */
.toast{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px));
}
.toast-in{
  pointer-events:auto;background:var(--ink);color:var(--bg);
  display:flex;align-items:baseline;gap:2.5ch;max-width:100%;
  padding:.75em 1.6ch;font-size:.82rem;letter-spacing:.05em;font-weight:400;
  opacity:0;transform:translateY(10px);visibility:hidden;
  transition:opacity .22s, transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s .3s;
}
.toast.show .toast-in{opacity:1;transform:none;visibility:visible;transition:opacity .22s, transform .3s cubic-bezier(.2,.8,.2,1)}
#toastMsg{min-width:0}
#toastUndo{color:var(--bg);text-decoration:underline;text-underline-offset:3px;flex:none}

@media (max-width:520px){
  :root{--m:7ch;--g:1.1ch}
  .meta,.foot{padding-left:2.5ch}
  .title-row h2{font-size:1.18em}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head><body>

<main class="page">
  <header>
    <h1 class="brand">SHORT LIST SUPPERS</h1>
    <ul class="meta shop" id="shop" aria-label="Nearest store">
      <li>

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const KEY = 'shortlist-suppers.v1';
const byId = Object.fromEntries(MEALS.map(m => [m.id, m]));

let state = {cur:null, checks:{}, skipped:[]};
try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s && typeof s === 'object') state = Object.assign(state, s);
} catch (e) {}
if (!byId[state.cur]) {
  const d = new Date(), start = new Date(d.getFullYear(), 0, 0);
  state.cur = MEALS[Math.floor((d - start) / 864e5) % MEALS.length].id;
}
state.skipped = (state.skipped || []).filter(id => byId[id]);

function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function buzz(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
const checked = () => state.checks[state.cur] || (state.checks[state.cur] = []);


const box = (mid = ' ') => `<span class="box" aria-hidden="true"><span>[</span><span class="mid">${mid}</span><span>]</span><i class="dot"></i></span>`;

/* decode-style title change; mono keeps the width steady */
function scramble(el, text){
  el.setAttribute('aria-label', text);
  cancelAnimationFrame(el._raf);
  if (reduce) { el.textContent = text; return; }
  const glyphs = 'abcdefghijklmnopqrstuvwxyz';
  const t0 = performance.now(), dur = Math.min(560, 180 + text.length * 16);
  const step = t => {
    const p = Math.min(1, (t - t0) / dur), n = Math.floor(p * text.length);
    let out = text.slice(0, n);
    for (let i = n; i < text.length; i++) out += text[i] === ' ' ? ' ' : glyphs[(Math.random() * 26) | 0];
    el.textContent = out;
    if (p < 1) el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}

function renderMeal(animate){
  const m = byId[state.cur], done = checked();
  if (animate) scramble($('mealName'), m.name);
  else { $('mealName').textContent = m.name; $('mealName').setAttribute('aria-label', m.name); }
  $('mealMeta').innerHTML = `<span class="nw">${m.min} MIN · SERVES ${m.serves} ·</span> <span class="nw">+ SALT, PEPPER, OIL</span>`;

  $('buyList').innerHTML = m.buy.map(([n, q], i) => `
    <li style="--i:${i}"><button type="button" class="row item${done.includes(i) ? ' on' : ''}" role="checkbox" aria-checked="${done.includes(i)}" data-i="${i}">
      <span class="lab">${i === 0 ? 'BUY' : ''}</span>${box()}<span class="txt"><span class="s">${n}</span></span><span class="qty">${q}</span>
    </button></li>`).join('');

  $('cookList').innerHTML = m.cook.map((s, i) => `
    <li class="row step" style="--i:${i + m.buy.length}">
      <span class="lab">${i === 0 ? 'COOK' : ''}</span><span class="num">${i + 1}</span><span class="txt">${s}</span><span></span>
    </li>`).join('');

  ['buyList', 'cookList'].forEach(id => {
    const el = $(id);
    el.classList.remove('enter');
    if (animate && !reduce) { void el.offsetWidth; el.classList.add('enter'); }
  });
  $('segs').innerHTML = m.buy.map(() => '<i class="seg"></i>').join('');
  renderProgress();
  renderMenu();
}

function renderProgress(celebrate){
  const m = byId[state.cur], n = checked().length, total = m.buy.length;
  $('count').textContent = `${n}/${total}`;
  [...$('segs').children].forEach((s, i) => s.classList.toggle('f', i < n));
  const all = n === total;
  $('progress').classList.toggle('all', all);
  $('doneMsg').textContent = all ? 'ALL IN THE BAG. GO COOK ↓' : n ? 'IN THE BAG' : 'NOTHING IN THE BAG YET';
  $('clearBtn').setAttribute('aria-disabled', String(n === 0));
  if (celebrate && !reduce) {
    const l = $('buyList');
    l.classList.remove('wave'); void l.offsetWidth; l.classList.add('wave');
  }
}

function renderMenu(){
  $('menuList').innerHTML = MEALS.map(m => {
    const cur = m.id === state.cur, skip = !cur && state.skipped.includes(m.id);
    return `<li><button type="button" class="row item${cur ? ' on' : ''}${skip ? ' skip' : ''}" data-id="${m.id}" ${cur ? 'aria-current="true"' : ''}>
      <span class="lab">${cur ? 'TONIGHT' : ''}</span>${box(skip ? '×' : ' ')}<span class="txt"><span class="s">${m.name}</span></span><span class="qty">${m.min} MIN</span>
    </button></li>`;
  }).join('');
}

function setMeal(id, animate){
  state.cur = id;
  state.skipped = state.skipped.filter(s => s !== id);
  save();
  renderMeal(animate);
}

/* toast */
let toastTimer, undoFn = null;
function toast(msg, undo){
  $('toastMsg').textContent = msg;
  undoFn = undo || null;
  $('toastUndo').hidden = !undo;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), undo ? 4200 : 2400);
}
$('toastUndo').addEventListener('click', () => {
  if (undoFn) undoFn();
  undoFn = null;
  $('toast').classList.remove('show');
});

/* something else: skip current, pick a fresh one */
function next(){
  const prev = state.cur, prevSkipped = state.skipped.slice();
  if (!state.skipped.includes(prev)) state.skipped.push(prev);
  let pool = MEALS.filter(m => !state.skipped.includes(m.id));
  if (!pool.length) { state.skipped = [prev]; pool = MEALS.filter(m => m.id !== prev); }
  const pick = pool[(Math.random() * pool.length) | 0];
  const btn = $('nextBtn');
  btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin');
  buzz(10);
  setMeal(pick.id, true);
  state.skipped = state.skipped.filter(s => s !== pick.id);
  if (!state.skipped.includes(prev)) state.skipped.push(prev);
  save(); renderMenu();
  toast(`[×] PASSED ON ${byId[prev].name.toUpperCase()}`, () => {
    state.skipped = prevSkipped;
    setMeal(prev, true);
  });
}

$('nextBtn').addEventListener('click', next);
$('nextBtn2').addEventListener('click', () => {
  next();
  $('meal').scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'});
});

$('buyList').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  const i = +b.dataset.i, list = checked(), at = list.indexOf(i);
  if (at > -1) list.splice(at, 1); else list.push(i);
  const on = at === -1;
  b.classList.toggle('on', on);
  b.setAttribute('aria-checked', String(on));
  buzz(on ? 8 : 4);
  save();
  const all = list.length === byId[state.cur].buy.length;
  renderProgress(all && on);
  if (all && on) toast('[✓] EVERYTHING’S IN THE BAG');
});

$('clearBtn').addEventListener('click', () => {
  const before = checked().slice();
  state.checks[state.cur] = [];
  save(); renderMeal(false);
  toast('[−] LIST CLEARED', () => { state.checks[state.cur] = before; save(); renderMeal(false); });
});

$('menuList').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b || b.dataset.id === state.cur) return;
  buzz(8);
  setMeal(b.dataset.id, true);
  $('meal').scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'});
});

/* copy remaining items */
function selectList(){
  const r = document.createRange(); r.selectNodeContents($('buyList'));
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
$('copyBtn').addEventListener('click', () => {
  const m = byId[state.cur], done = checked();
  const left = m.buy.filter((_, i) => !done.includes(i));
  if (!left.length) { toast('[✓] NOTHING LEFT TO BUY'); return; }
  const text = `${m.name}: shopping list\n` + left.map(([n, q]) => `[ ] ${n}, ${q}`).join('\n');
  const ok = () => toast(`[↗] COPIED ${left.length} ITEM${left.length > 1 ? 'S' : ''}`);
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let done = false; try { done = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    if (done) ok(); else { selectList(); toast('COPY IS BLOCKED HERE. THE LIST IS SELECTED, COPY IT BY HAND'); }
  };
  try {
    navigator.clipboard.writeText(text).then(ok, fallback);
  } catch (e) { fallback(); }
});

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input,textarea')) return;
  if (e.key === 'n' || e.key === 'N') next();
});

/* ---------- nearest shop: live location, OpenStreetMap, compass ---------- */
const shop = {state:'idle', err:null, here:null, queryAt:null, places:[], idx:0, selId:null,
  heading:null, compass:'off', target:0, shown:0, raf:0, aligned:false, watch:null, busy:false};
const TYPES = {supermarket:'SUPERMARKET', convenience:'CONVENIENCE STORE', greengrocer:'GREENGROCER', grocery:'GROCERY'};
const ENDPOINTS = ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const touch = matchMedia('(pointer:coarse)').matches;
const rotEl = $('rot'), arrowBtn = $('arrowBtn');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const wrap = x => (((x % 360) + 540) % 360) - 180;
if (state.shopFilter !== 'super') state.shopFilter = 'any';

function dist(a, b){
  const dLa = rad(b.lat - a.lat), dLo = rad(b.lon - a.lon);
  const h = Math.sin(dLa/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLo/2)**2;
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
}
function bearing(a, b){
  const y = Math.sin(rad(b.lon - a.lon)) * Math.cos(rad(b.lat));
  const x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) - Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(rad(b.lon - a.lon));
  return (deg(Math.atan2(y, x)) + 360) % 360;
}
const DIRS = ['NORTH','NORTH-EAST','EAST','SOUTH-EAST','SOUTH','SOUTH-WEST','WEST','NORTH-WEST'];
const dirName = b => DIRS[Math.round(b / 45) % 8];
function dms(v, pos, neg){
  const a = Math.abs(v); let d = Math.floor(a), m = Math.floor((a - d) * 60), s = Math.round(((a - d) * 60 - m) * 60);
  if (s === 60) { s = 0; m++; } if (m === 60) { m = 0; d++; }
  return `${d}°${m}'${s}"${v >= 0 ? pos : neg}`;
}
const list = () => shop.places.filter(p => state.shopFilter !== 'super' || p.type === 'supermarket');
const current = () => { const L = list(); return shop.state === 'found' && L.length ? L[shop.idx % L.length] : null; };
const walkUrl = p => isIOS ? `https://maps.apple.com/?daddr=${p.lat},${p.lon}&dirflg=w`
                           : `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=walking`;
const searchUrl = isIOS ? 'https://maps.apple.com/?q=grocery+store' : 'https://www.google.com/maps/search/grocery+store/';

function renderFilters(){
  document.querySelectorAll('.fbtn').forEach(b => b.setAttribute('aria-checked', String(b.dataset.f === state.shopFilter)));
}

function renderShop(){
  const nm = $('shopName'), ds = $('shopDist'), act = $('shopAct');
  arrowBtn.classList.toggle('seek', shop.state === 'locating' || shop.state === 'searching');
  $('shopActRow').hidden = $('shopInfoRow').hidden = $('shopCompassRow').hidden = true;
  ds.className = 'ln mute';
  const p = current();

  if (shop.state === 'idle') {
    nm.innerHTML = '<button type="button" class="u strong" id="findBtn">FIND THE NEAREST STORE</button>';
    ds.textContent = 'STEPS AND DIRECTION FROM WHERE YOU ARE';
  } else if (shop.state === 'locating') {
    nm.innerHTML = '<span class="cur">FINDING YOU</span>';
    ds.textContent = 'ALLOW LOCATION IF YOUR PHONE ASKS';
  } else if (shop.state === 'searching') {
    nm.innerHTML = '<span class="cur">LOOKING FOR SHOPS NEARBY</span>';
    ds.textContent = 'CHECKING OPENSTREETMAP';
  } else if (shop.state === 'found' && p) {
    const L = list(), walk = p.d * 1.25;
    const steps = Math.max(10, Math.round(walk / 0.76 / 10) * 10), min = Math.max(1, Math.round(walk / 80));
    nm.innerHTML = `<span class="strong">${esc(p.name.toUpperCase())}</span>`;
    ds.className = 'ln';
    ds.textContent = p.d < 35 ? "YOU'RE HERE. GO SHOPPING ↓" : `≈ ${steps.toLocaleString('en')} STEPS · ${min} MIN · ${dirName(bearing(shop.here, p))}`;
    act.innerHTML = `<a class="u" href="${walkUrl(p)}" target="_blank" rel="noopener">WALK THERE</a>` +
      (L.length > 1 ? `<button type="button" class="u" id="nextShop">[→] NEXT ${shop.idx + 1}/${L.length}</button>` : '');
    $('shopInfo').textContent = `${TYPES[p.type] || 'SHOP'} · ${p.addr ? p.addr.toUpperCase() : dms(p.lat, 'N', 'S') + ', ' + dms(p.lon, 'E', 'W')}`;
    $('shopActRow').hidden = $('shopInfoRow').hidden = $('shopCompassRow').hidden = false;
    renderCompass();
  } else {
    const filtered = shop.state === 'found';
    const msgs = {
      framed: ["LOCATION IS BLOCKED HERE", "CLAUDE.AI DOESN'T LET PAGES ASK FOR LOCATION. OPEN THE HOSTED VERSION, OR SEARCH IN MAPS"],
      denied: ["LOCATION IS OFF", "ALLOW LOCATION FOR THIS PAGE IN YOUR BROWSER, OR SEARCH IN MAPS"],
      noloc:  ["CAN'T FIND YOUR LOCATION", "YOUR PHONE DIDN'T SHARE A POSITION. TRY AGAIN, OR SEARCH IN MAPS"],
      net:    ["CAN'T REACH THE MAP SERVICE", "CHECK YOUR CONNECTION AND TRY AGAIN"],
      none:   ["NO SHOPS NEARBY", "NOTHING WITHIN 3.5 KM ON OPENSTREETMAP"]
    };
    const [a, b] = filtered ? ["NO SUPERMARKETS NEARBY", "SWITCH TO ANY SHOP, OR SEARCH IN MAPS"] : msgs[shop.err] || msgs.noloc;
    nm.innerHTML = `<span class="strong">${a}</span>`;
    ds.textContent = b;
    act.innerHTML = `<a class="u" href="${searchUrl}" target="_blank" rel="noopener">SEARCH IN MAPS</a>` +
      (filtered ? '' : '<button type="button" class="u" id="retryBtn">[↻] TRY AGAIN</button>');
    $('shopActRow').hidden = false;
  }
}

function renderCompass(){
  const el = $('shopCompass'); if (!el) return;
  const t = {
    off: touch ? 'TAP THE ARROW TO USE YOUR COMPASS' : 'ARROW POINTS WITH NORTH AT THE TOP',
    waiting: 'STARTING COMPASS…',
    on: shop.aligned ? "YOU'RE FACING IT. WALK THIS WAY" : 'TURN UNTIL THE ARROW POINTS STRAIGHT UP',
    none: 'NO COMPASS HERE. NORTH IS AT THE TOP',
    denied: 'COMPASS IS OFF. NORTH IS AT THE TOP'
  };
  el.textContent = t[shop.compass];
}

/* arrow: shortest-path easing toward the target angle */
function aim(){
  const p = current();
  let target = 0;
  if (p && shop.here) {
    const b = bearing(shop.here, p);
    target = shop.compass === 'on' && shop.heading != null ? b - shop.heading : b;
  }
  shop.target = target;
  const al = !!p && p.d >= 35 && shop.compass === 'on' && Math.abs(wrap(target)) < 14;
  if (al !== shop.aligned) {
    shop.aligned = al;
    arrowBtn.classList.toggle('aligned', al);
    if (al) buzz(14);
    renderCompass();
  }
  if (!shop.raf) shop.raf = requestAnimationFrame(spin);
}
function spin(){
  const delta = wrap(shop.target - shop.shown);
  if (reduce || Math.abs(delta) < 0.3) { shop.shown += delta; shop.raf = 0; }
  else { shop.shown += delta * 0.16; shop.raf = requestAnimationFrame(spin); }
  rotEl.style.transform = `rotate(${shop.shown}deg)`;
}

function onOrient(e){
  let h = null;
  if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) h = e.webkitCompassHeading;
  else if (e.absolute && e.alpha != null) h = 360 - e.alpha;
  if (h == null) return;
  const so = (screen.orientation && screen.orientation.angle) || 0;
  shop.heading = (h + so) % 360;
  if (shop.compass !== 'on') { shop.compass = 'on'; renderCompass(); }
  aim();
}
/* must start inside a tap: iOS asks permission for motion sensors */
function startCompass(){
  if (shop.compass === 'on' || shop.compass === 'waiting') return Promise.resolve();
  const begin = () => {
    const ev = 'ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation';
    addEventListener(ev, onOrient);
    shop.compass = 'waiting'; renderCompass();
    setTimeout(() => {
      if (shop.compass === 'waiting') { shop.compass = 'none'; removeEventListener(ev, onOrient); renderCompass(); aim(); }
    }, 2500);
  };
  try {
    if (!window.DeviceOrientationEvent) { shop.compass = 'none'; renderCompass(); return Promise.resolve(); }
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      return DeviceOrientationEvent.requestPermission()
        .then(r => { if (r === 'granted') begin(); else { shop.compass = 'denied'; renderCompass(); } })
        .catch(() => { shop.compass = 'denied'; renderCompass(); });
    }
    begin();
  } catch (e) { shop.compass = 'none'; renderCompass(); }
  return Promise.resolve();
}

let framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
function fail(code){
  if (framed && (code === 'denied' || code === 'noloc')) code = 'framed';
  shop.state = 'error'; shop.err = code; renderShop(); aim();
}

function find(){
  buzz(8);
  if (touch) startCompass().then(locate); else locate();
}
function locate(){
  if (!('geolocation' in navigator)) return fail('noloc');
  shop.state = 'locating'; renderShop();
  let settled = false;
  const done = () => { const was = settled; settled = true; clearTimeout(guard); return was; };
  const guard = setTimeout(() => { if (!done()) fail('noloc'); }, 20000);
  try {
    navigator.geolocation.getCurrentPosition(
      pos => { if (!done()) gotFix(pos); },
      err => { if (!done()) fail(err && err.code === 1 ? 'denied' : 'noloc'); },
      {enableHighAccuracy: true, timeout: 15000, maximumAge: 30000});
  } catch (e) { if (!done()) fail('denied'); }
}
function gotFix(pos){
  shop.here = {lat: pos.coords.latitude, lon: pos.coords.longitude};
  if (!shop.queryAt || dist(shop.queryAt, shop.here) > 600) search(false); else update();
  if (shop.watch == null) {
    try {
      shop.watch = navigator.geolocation.watchPosition(p => {
        shop.here = {lat: p.coords.latitude, lon: p.coords.longitude};
        if (shop.state !== 'found') return;
        if (dist(shop.queryAt, shop.here) > 600) search(true); else update();
      }, () => {}, {enableHighAccuracy: true, maximumAge: 5000});
    } catch (e) {}
  }
}

async function overpass(q){
  for (const url of ENDPOINTS) {
    const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 12000);
    try {
      const r = await fetch(url, {method: 'POST', body: 'data=' + encodeURIComponent(q),
        headers: {'Content-Type': 'application/x-www-form-urlencoded'}, signal: ctrl.signal});
      clearTimeout(t);
      if (r.ok) return await r.json();
    } catch (e) { clearTimeout(t); }
  }
  throw new Error('net');
}
function parse(data){
  const seen = new Set(), out = [];
  for (const el of (data.elements || [])) {
    const lat = el.lat ?? (el.center && el.center.lat), lon = el.lon ?? (el.center && el.center.lon);
    if (lat == null || lon == null) continue;
    const t = el.tags || {}, type = t.shop;
    const name = (t.name || t.brand || '').trim() ||
      (type === 'convenience' ? 'Convenience store' : type === 'supermarket' ? 'Supermarket' : 'Grocery shop');
    const key = name.toLowerCase() + '|' + lat.toFixed(3) + ',' + lon.toFixed(3);
    if (seen.has(key)) continue; seen.add(key);
    const addr = t['addr:street'] ? `${t['addr:housenumber'] ? t['addr:housenumber'] + ' ' : ''}${t['addr:street']}` : '';
    out.push({id: el.type + el.id, name, type, lat, lon, addr, d: 0});
  }
  return out;
}
async function search(quiet){
  if (shop.busy) return; shop.busy = true;
  const at = {...shop.here};
  if (!quiet) { shop.state = 'searching'; renderShop(); }
  try {
    let places = [];
    for (const R of [1200, 3500]) {
      places = parse(await overpass(
        `[out:json][timeout:15];nwr["shop"~"^(supermarket|convenience|greengrocer|grocery)$"](around:${R},${at.lat.toFixed(6)},${at.lon.toFixed(6)});out center tags;`));
      if (places.some(p => p.type === 'supermarket')) break;
    }
    shop.places = places; shop.queryAt = at; shop.selId = null;
    shop.state = places.length ? 'found' : 'error'; shop.err = places.length ? null : 'none';
    if (places.length && !quiet) buzz([8, 60, 8]);
    update();
  } catch (e) { if (!quiet) fail('net'); }
  shop.busy = false;
}
function update(){
  if (shop.here) shop.places.forEach(p => p.d = dist(shop.here, p));
  shop.places.sort((a, b) => a.d - b.d);
  const L = list();
  const i = shop.selId ? L.findIndex(p => p.id === shop.selId) : -1;
  shop.idx = i > -1 ? i : 0;
  shop.selId = L[shop.idx] ? L[shop.idx].id : null;
  renderShop(); aim();
}

$('shop').addEventListener('click', e => {
  if (e.target.closest('#findBtn') || e.target.closest('#retryBtn')) return find();
  if (e.target.closest('#nextShop')) {
    const L = list(); shop.idx = (shop.idx + 1) % L.length; shop.selId = L[shop.idx].id;
    buzz(8); renderShop(); aim(); return;
  }
  const f = e.target.closest('.fbtn');
  if (f && f.dataset.f !== state.shopFilter) {
    state.shopFilter = f.dataset.f; save(); renderFilters(); buzz(6);
    shop.selId = null;
    if (shop.state === 'found') update();
  }
});
arrowBtn.addEventListener('click', () => {
  if (shop.state === 'idle' || shop.state === 'error') return find();
  if (shop.compass === 'off' || shop.compass === 'denied') startCompass();
});

renderFilters();
renderShop();
renderMeal(false);
</script>

</body></html>
